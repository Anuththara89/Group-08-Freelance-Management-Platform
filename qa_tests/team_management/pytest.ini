[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ordering: run files in alphabetical order (01, 02, 03)
# Verbose output + short traceback for cleaner reports
addopts =
    -v
    --tb=short
    --strict-markers

log_cli = true
log_cli_level = WARNING
